<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>fnikhilhuhcodes.vercel.app</title>
    
     <meta name="description" content="fnikhilhuhcodes.vercel.app
         ">


    <!-- Search Engine Indexing -->
    <meta name="robots" content="index, follow">
    <meta name="googlebot" content="index, follow">
    <meta name="bingbot" content="index, follow">

    <!-- Allow other common crawlers -->
    <meta name="slurp" content="index, follow">
    <meta name="duckduckbot" content="index, follow">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(135deg, #0f172a, #1e293b);
            color: #fff;
            text-align: center;
        }

        .redirect-box {
            width: 90%;
            max-width: 500px;
            padding: 40px 25px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
        }

        .loader {
            width: 70px;
            height: 70px;
            margin: 0 auto 25px;
            border: 6px solid rgba(255, 255, 255, 0.2);
            border-top: 6px solid #38bdf8;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        h1 {
            font-size: 28px;
            margin-bottom: 12px;
        }

        p {
            color: #cbd5e1;
            font-size: 16px;
            line-height: 1.6;
        }

        #countdown {
            display: inline-block;
            margin: 20px 0;
            font-size: 48px;
            font-weight: bold;
            color: #38bdf8;
        }

        .domain {
            color: #fff;
            font-weight: bold;
            word-break: break-all;
        }

        .redirect-btn {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 25px;
            border: none;
            border-radius: 10px;
            background: #38bdf8;
            color: #0f172a;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            transition: 0.2s ease;
        }

        .redirect-btn:hover {
            transform: translateY(-2px);
            background: #7dd3fc;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        @media (max-width: 500px) {
            .redirect-box {
                padding: 30px 20px;
            }

            h1 {
                font-size: 24px;
            }

            #countdown {
                font-size: 42px;
            }
        }
    </style>
</head>

<body>

    <div class="redirect-box">

        <div class="loader"></div>

        <h1>Redirecting...</h1>

        <p>
            You will be redirected in
        </p>

        <div id="countdown">3</div>

        <p>
            Redirecting to:
            <br>
            <span class="domain" id="domainText"></span>
        </p>

        <a
            href="https://nerswn.ct.ws/"
            class="redirect-btn"
            id="redirectButton"
        >
            Continue Now
        </a>

    </div>


    <script>

        // ==========================================
        // CHANGE YOUR DOMAIN HERE
        // ==========================================

        const redirectURL = "https://nerswn.ct.ws/";


        // ==========================================
        // COUNTDOWN
        // ==========================================

        let seconds = 3;

        const countdown = document.getElementById("countdown");
        const domainText = document.getElementById("domainText");
        const redirectButton = document.getElementById("redirectButton");


        // Show domain
        domainText.textContent = redirectURL;

        // Set button URL
        redirectButton.href = redirectURL;


        // Countdown timer
        const timer = setInterval(() => {

            seconds--;

            countdown.textContent = seconds;

            if (seconds <= 0) {

                clearInterval(timer);

                window.location.replace(redirectURL);

            }

        }, 1000);

    </script>

</body>
</html>
